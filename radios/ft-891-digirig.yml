---
# Yaesu FT-891 with a Digirig Mobile.
# CAT goes through the radio's own USB port; audio and PTT go through the Digirig
# on the radio's 6-pin DATA jack.
# Radio menu: set 05-06 CAT RATE to 38400 to match cat_baud.
radio_name: Yaesu FT-891 + Digirig
rig_model: 1036            # Hamlib RIG_MODEL_FT891
cat_baud: 38400

# Radio USB: Silicon Labs CP2105 dual UART. Interface 00 is the "Enhanced" port (CAT).
cat_udev_match: 'ATTRS{idVendor}=="10c4", ATTRS{idProduct}=="ea70", ENV{ID_USB_INTERFACE_NUM}=="00"'

# PTT keyed by RTS on the Digirig's CP2102 serial port.
ptt_method: RTS
ptt_udev_match: 'ATTRS{idVendor}=="10c4", ATTRS{idProduct}=="ea60"'

# Digirig sound card (C-Media CM108).
audio_udev_match: 'ATTRS{idVendor}=="0d8c", ATTRS{idProduct}=="0012"'
