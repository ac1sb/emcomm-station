---
# First-boot defaults. After the first build, change callsign, grid, radio,
# baud rate and PTT on the station's Settings screen; re-running the playbook
# keeps what was set there.

station_callsign: N0CALL
station_grid: AA00
# Preset in radios/ (without .yml) to start from: ft-891-digirig, ft-710.
# Any other Hamlib radio can be picked in Settings.
station_radio: ft-891-digirig

# Local account that auto-logs in and runs the kiosk.
station_user: radio

# kiosk:   a dedicated station. Boots straight into the launcher (auto-login,
#          Openbox only, quiet boot) and installs every app.
# desktop: on a Debian or Ubuntu computer already in use, for the person's own
#          account. Adds an Emcomm-CNC app (and login session) and leaves the
#          desktop, login, boot and clock as they are; apps install from their
#          tiles. install-desktop.sh sets this and station_user in host_vars/.
station_mode: kiosk

# Apps shown on the home screen.
#   command: the program that must be installed; until it is, the tile offers
#            to install it (app: its tag in roles/apps).
#   run:     what the tile starts.
#   page:    instead of run, a part of the launcher the tile opens (nwr: weather radio setup,
#            online: the Online page).
#   ready:   a file that must exist too, else the tile offers to set it up (VARA).
#   icon:    image name in /usr/share/emcomm/icons (.svg or .png). Long-press or
#            right-click a tile to use your own picture instead.
#   desktop: settings that replace the ones above in desktop mode (station_mode).
launcher_apps:
  - { code: JS8, icon: js8call, name: JS8Call, detail: HF messaging, command: js8call, app: js8call, run: [emcomm-start, js8call] }
  - { code: WL, icon: winlink, name: Winlink mail, detail: Pat, command: pat, app: pat, run: [emcomm-start, pat] }
  - code: VHF
    icon: vara-hf
    name: VARA HF
    detail: Winlink modem
    command: wine
    app: vara
    ready: ~/.wine-vara/drive_c/VARA/VARA.exe
    run: [emcomm-start, vara-hf]
  - code: VFM
    icon: vara-fm
    name: VARA FM
    detail: VHF/UHF modem
    command: wine
    app: vara
    ready: ~/.wine-vara/drive_c/VARA FM/VARAFM.exe
    run: [emcomm-start, vara-fm]
  - { code: "213", icon: flmsg, name: Forms, detail: flmsg · ICS-213, command: flmsg, app: flmsg, run: [emcomm-start, flmsg] }
  - { code: FLD, icon: fldigi, name: fldigi, detail: Digital modes · flamp, command: fldigi, app: fldigi, run: [emcomm-start, fldigi] }
  - { code: PKT, icon: packet, name: Packet, detail: Winlink packet, command: direwolf, app: packet, run: [emcomm-start, packet] }
  - { code: ARD, icon: ardop, name: ARDOP, detail: Winlink HF modem, command: ardopcf, app: ardop, run: [emcomm-start, ardop] }
  - { code: APR, icon: aprs, name: APRS, detail: Xastir · map and messages, command: xastir, app: aprs, run: [emcomm-start, aprs] }
  - { code: MSH, icon: meshtastic, name: Meshtastic, detail: Mesh text over LoRa, command: contact, app: meshtastic, run: [emcomm-start, meshtastic] }
  - { code: MCR, icon: meshcore, name: MeshCore, detail: Mesh text over LoRa, command: meshcore-cli, app: meshcore, run: [emcomm-start, meshcore] }
  - { code: NWR, icon: weather-radio, name: NOAA radio, detail: Alerts · no internet, command: emcomm-nwr, page: nwr }
  - { code: ONL, icon: online, name: Online, detail: Needs the internet, command: emcomm-online, page: online }
  - { code: MAP, icon: map, name: Map, detail: Gateways · stations heard, command: emcomm-map, app: map, run: [emcomm-map] }
  - { code: CHP, icon: chirp, name: CHIRP, detail: Program handhelds · mobiles, command: chirp, app: chirp, run: [chirp] }
  - { code: SCN, icon: scanner, name: Scanner, detail: SDR · police fire EMS, command: emcomm-scanner, app: scanner, run: [emcomm-scanner] }
  - { code: SDR, icon: sdr, name: Gqrx, detail: Any SDR · HF to UHF, command: gqrx, app: sdr, run: [emcomm-start, sdr] }
  - { code: LIB, icon: library, name: Library, detail: Offline books · first aid, command: emcomm-library, app: library, run: [emcomm-library] }
  - code: WEB
    icon: browser
    name: Browser
    detail: Chromium · ham bookmarks
    command: chromium
    app: browser
    run: [chromium, --password-store=basic]
    # In desktop mode, the person's own browser with a page of the same bookmarks.
    desktop: { detail: Your browser · ham bookmarks, command: xdg-open, run: [xdg-open, /usr/share/emcomm/bookmarks.html] }
  - { code: FT8, icon: wsjtx, name: WSJT-X, detail: FT8 · band check, command: wsjtx, app: wsjtx, run: [emcomm-start, wsjtx] }

# Home folders in the standard order, each where its first app would be. Tiles can be
# moved in and out, and folders added, renamed or removed, with Arrange tiles on the station.
launcher_folders:
  - { name: Email, apps: [WL, VHF, VFM, ARD, PKT] }
  - { name: Mesh & APRS, apps: [MSH, MCR, APR] }
