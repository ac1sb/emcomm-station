---
- name: Install Hamlib
  ansible.builtin.apt:
    name: libhamlib-utils
    install_recommends: false

- name: Create the radio preset directory
  ansible.builtin.file:
    path: /usr/share/emcomm/radios
    state: directory
    mode: "0755"

- name: Install radio presets
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', item) | from_yaml | to_nice_json }}\n"
    dest: "/usr/share/emcomm/radios/{{ item | basename | splitext | first }}.json"
    mode: "0644"
  loop: "{{ query('ansible.builtin.fileglob', playbook_dir + '/radios/*.yml') }}"

- name: Install the settings helper
  ansible.builtin.copy:
    src: emcomm-apply-settings
    dest: /usr/local/sbin/emcomm-apply-settings
    mode: "0755"

- name: Let the station user save settings from the Settings screen
  ansible.builtin.copy:
    content: "{{ station_user }} ALL=(root) NOPASSWD: /usr/local/sbin/emcomm-apply-settings\n"
    dest: /etc/sudoers.d/emcomm-settings
    mode: "0440"
    validate: visudo -cf %s

- name: Write first-boot settings (kept if they already exist)
  ansible.builtin.copy:
    content: "{{ first_boot_settings | to_nice_json }}\n"
    dest: /etc/emcomm/station.json
    mode: "0644"
    force: false
  vars:
    first_boot_settings: >-
      {{ lookup('ansible.builtin.file', playbook_dir + '/radios/' + station_radio + '.yml') | from_yaml
         | combine({'callsign': station_callsign, 'grid': station_grid}) }}

- name: Install the rigctld service
  ansible.builtin.template:
    src: rigctld.service.j2
    dest: /etc/systemd/system/rigctld.service
    mode: "0644"

- name: Enable rigctld (it starts when the radio's CAT port appears)
  ansible.builtin.systemd:
    name: rigctld
    enabled: true
    daemon_reload: true

- name: Apply the current settings (udev rules, rigctld arguments)
  ansible.builtin.command: /usr/local/sbin/emcomm-apply-settings
  changed_when: false
