---
- name: Install Hamlib
  ansible.builtin.apt:
    name: libhamlib-utils
    install_recommends: false

- name: Create the radio preset directory
  ansible.builtin.file:
    path: /usr/share/emcomm/radios
    state: directory
    mode: "0755"

- name: Install radio presets
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', item) | from_yaml | to_nice_json }}\n"
    dest: "/usr/share/emcomm/radios/{{ item | basename | splitext | first }}.json"
    mode: "0644"
  loop: "{{ query('ansible.builtin.fileglob', playbook_dir + '/radios/*.yml') }}"

- name: Install the settings helper
  ansible.builtin.copy:
    src: emcomm-apply-settings
    dest: /usr/local/sbin/emcomm-apply-settings
    mode: "0755"

- name: Install the default-audio helper (makes the radio every app's sound card)
  ansible.builtin.copy:
    src: emcomm-audio-default
    dest: /usr/local/bin/emcomm-audio-default
    mode: "0755"

- name: Let the station user save settings from the Settings screen
  ansible.builtin.copy:
    content: "{{ station_user }} ALL=(root) NOPASSWD: /usr/local/sbin/emcomm-apply-settings\n"
    dest: /etc/sudoers.d/emcomm-settings
    mode: "0440"
    validate: visudo -cf %s

- name: Write first-boot settings (kept if they already exist)
  ansible.builtin.copy:
    content: "{{ first_boot_settings | to_nice_json }}\n"
    dest: /etc/emcomm/station.json
    mode: "0644"
    force: false
  vars:
    first_boot_settings: >-
      {{ lookup('ansible.builtin.file', playbook_dir + '/radios/' + station_radio + '.yml') | from_yaml
         | combine({'callsign': station_callsign, 'grid': station_grid}) }}

- name: Install the rigctld service
  ansible.builtin.template:
    src: rigctld.service.j2
    dest: /etc/systemd/system/rigctld.service
    mode: "0644"

- name: Enable rigctld (it starts when the radio's CAT port appears)
  ansible.builtin.systemd:
    name: rigctld
    enabled: true
    daemon_reload: true

# A USB GPS sets the clock when there's no internet (FT8, JS8 and VARA need it
# within a second or so) and gives the launcher a position for the grid square.
- name: Install gpsd and chrony
  ansible.builtin.apt:
    name: [gpsd, gpsd-clients, chrony]
    install_recommends: false

- name: Point gpsd at /dev/gps0 only, so it never opens the radio's ports
  ansible.builtin.copy:
    content: |
      # Written by the Emcomm-CNC playbook. Settings picks which USB device is /dev/gps0.
      START_DAEMON="true"
      USBAUTO="false"
      DEVICES="/dev/gps0"
      GPSD_OPTIONS="-n"
    dest: /etc/default/gpsd
    mode: "0644"
  notify: Restart gpsd

- name: Let chrony take the time from the GPS
  ansible.builtin.copy:
    content: |
      # Written by the Emcomm-CNC playbook. GPS time over USB, without PPS, is good to
      # a few tens of milliseconds: plenty for digital modes, and it works offline.
      refclock SHM 0 refid GPS precision 1e-1 offset 0.1 delay 0.2
      # Step the clock at any time if it's more than a second out (a flat CMOS battery).
      makestep 1 -1
    dest: /etc/chrony/conf.d/emcomm-gps.conf
    mode: "0644"
  notify: Restart chrony

# NOAA Weather Radio alerts with no internet: an RTL-SDR dongle on 162 MHz, decoded
# by multimon-ng. The service waits quietly until a channel is picked on the
# Online page and a dongle is plugged in.
- name: Install the RTL-SDR tools and the SAME decoder
  ansible.builtin.apt:
    name: [rtl-sdr, multimon-ng]
    install_recommends: false

- name: Keep the TV-tuner driver off the RTL-SDR dongle
  ansible.builtin.copy:
    content: "# Managed by the emcomm-station playbook.\nblacklist dvb_usb_rtl28xxu\n"
    dest: /etc/modprobe.d/emcomm-rtl-sdr.conf
    mode: "0644"

- name: Install the weather radio listener
  ansible.builtin.copy:
    src: emcomm-nwr
    dest: /usr/local/bin/emcomm-nwr
    mode: "0755"
  notify: Restart emcomm-nwr

- name: Install the weather radio service
  ansible.builtin.template:
    src: emcomm-nwr.service.j2
    dest: /etc/systemd/system/emcomm-nwr.service
    mode: "0644"
  notify: Restart emcomm-nwr

- name: Run the weather radio listener
  ansible.builtin.systemd:
    name: emcomm-nwr
    enabled: true
    state: started
    daemon_reload: true

- name: Apply the current settings (udev rules, rigctld arguments)
  ansible.builtin.command: /usr/local/sbin/emcomm-apply-settings
  changed_when: false
