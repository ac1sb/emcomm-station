---
- name: Restart gpsd
  ansible.builtin.systemd:
    name: gpsd
    state: restarted

- name: Restart chrony
  ansible.builtin.systemd:
    name: chrony
    state: restarted

- name: Restart emcomm-nwr
  ansible.builtin.systemd:
    name: emcomm-nwr
    state: restarted
    daemon_reload: true

- name: Restart emcomm-adsb
  ansible.builtin.systemd:
    name: emcomm-adsb
    state: restarted
    daemon_reload: true
