---
- name: Reload udev
  ansible.builtin.shell: udevadm control --reload && udevadm trigger --subsystem-match=tty --subsystem-match=sound
  changed_when: true

- name: Restart rigctld
  ansible.builtin.systemd:
    name: rigctld
    state: restarted
    daemon_reload: true
  # The radio may not be plugged in while building.
  failed_when: false
