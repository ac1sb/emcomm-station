---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - sudo
      - usbutils
      - alsa-utils
      - pipewire
      - pipewire-pulse
      - pipewire-alsa
      - wireplumber
      - curl
      - git
      - ca-certificates
      - bluez  # Meshtastic and MeshCore radios can connect by Bluetooth
    install_recommends: false
    update_cache: true
    cache_valid_time: 3600

- name: Start Bluetooth at boot
  ansible.builtin.systemd_service:
    name: bluetooth
    enabled: true
    state: started
  failed_when: false  # a machine without a Bluetooth adapter is fine

- name: Create the station user
  ansible.builtin.user:
    name: "{{ station_user }}"
    shell: "{{ '/bin/bash' if station_mode == 'kiosk' else omit }}"  # a desktop user keeps their own
    # systemd-journal: Diagnostics shows rigctld's log and recent USB events.
    # bluetooth: lets the mesh apps pair with and reach a radio over Bluetooth.
    groups: [dialout, audio, plugdev, video, systemd-journal, bluetooth]
    append: true

# The station user has no password and isn't meant to use sudo (see README,
# Accounts); earlier builds put it in the sudo group.
- name: Take the station user out of the sudo group
  ansible.builtin.command: gpasswd -d {{ station_user }} sudo
  register: base_sudo_group
  changed_when: base_sudo_group.rc == 0
  failed_when: false
  when: station_mode == 'kiosk'

# NetworkManager lets the user at the station's screen join Wi-Fi from the
# launcher's Wi-Fi page (polkit's standard rules for the active local session).
# Interfaces the Debian installer wrote to /etc/network/interfaces (usually the
# wired one) stay with ifupdown, so the network doesn't drop mid-install.
- name: Install NetworkManager, for joining Wi-Fi from the Wi-Fi page
  ansible.builtin.apt:
    name: [network-manager, polkitd]
    install_recommends: false
  when: station_mode == 'kiosk'  # a desktop already has its own networking

- name: Enable SSH for remote troubleshooting
  when: station_mode == 'kiosk'
  block:
    - name: Install the SSH server
      ansible.builtin.apt:
        name: openssh-server
        install_recommends: false

    - name: Start SSH at boot
      ansible.builtin.systemd:
        name: ssh
        enabled: true
        state: started

- name: Create the station config directory
  ansible.builtin.file:
    path: /etc/emcomm
    state: directory
    mode: "0755"

- name: Create the folder for settings to put back on uninstall
  ansible.builtin.file:
    path: /etc/emcomm/before
    state: directory
    mode: "0755"
  when: station_mode == 'desktop'

- name: Remember how this station was built (the launcher reads it)
  ansible.builtin.copy:
    content: "{{ station_mode }}\n"
    dest: /etc/emcomm/mode
    mode: "0644"

- name: Remember where this playbook lives, for Update station
  ansible.builtin.copy:
    content: "{{ playbook_dir }}\n"
    dest: /etc/emcomm/playbook-dir
    mode: "0644"

- name: Install the update helper
  ansible.builtin.copy:
    src: emcomm-update
    dest: /usr/local/sbin/emcomm-update
    mode: "0755"

- name: Let the station user install apps and updates from the launcher
  ansible.builtin.copy:
    content: |
      {{ station_user }} ALL=(root) NOPASSWD: /usr/local/sbin/emcomm-update
    dest: /etc/sudoers.d/emcomm-update
    mode: "0440"
    validate: visudo -cf %s
