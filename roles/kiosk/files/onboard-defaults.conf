# Managed by the emcomm-station playbook.
# Onboard, the on-screen keyboard: docked along the bottom of the screen and
# shown above full-screen windows. Onboard reads this the first time it starts;
# after that, changes made in Onboard's own settings are kept.
[main]
layout=Compact
theme=Nightshade
show-status-icon=False
start-minimized=False

[window]
docking-enabled=True
docking-edge=bottom
force-to-top=True

[window.landscape]
dock-height=220

[window.portrait]
dock-height=260

[auto-show]
enabled=False
