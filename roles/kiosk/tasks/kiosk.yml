---
- name: Create getty override directory
  ansible.builtin.file:
    path: /etc/systemd/system/getty@tty1.service.d
    state: directory
    mode: "0755"

- name: Auto-login the station user on the first console
  ansible.builtin.template:
    src: autologin.conf.j2
    dest: /etc/systemd/system/getty@tty1.service.d/autologin.conf
    mode: "0644"
  notify: Reload systemd

- name: Start X when the station user logs in on tty1
  ansible.builtin.copy:
    src: bash_profile
    dest: "/home/{{ station_user }}/.bash_profile"
    owner: "{{ station_user }}"
    group: "{{ station_user }}"
    mode: "0644"

- name: Run Openbox as the only session
  ansible.builtin.copy:
    content: "exec openbox-session\n"
    dest: "/home/{{ station_user }}/.xinitrc"
    owner: "{{ station_user }}"
    group: "{{ station_user }}"
    mode: "0644"

- name: Create Openbox config directory
  ansible.builtin.file:
    path: "/home/{{ station_user }}/.config/openbox"
    state: directory
    owner: "{{ station_user }}"
    group: "{{ station_user }}"
    mode: "0755"

- name: Start with the system's Openbox settings
  ansible.builtin.copy:
    src: /etc/xdg/openbox/rc.xml
    dest: "/home/{{ station_user }}/.config/openbox/rc.xml"
    remote_src: true
    force: false
    owner: "{{ station_user }}"
    group: "{{ station_user }}"
    mode: "0644"

# Apps open maximized, below the launcher's Home bar; the on-screen keyboard
# keeps its own size.
- name: Open apps maximized
  ansible.builtin.blockinfile:
    path: "/home/{{ station_user }}/.config/openbox/rc.xml"
    insertbefore: "^</applications>"
    marker: "<!-- {mark} emcomm-station: managed by the playbook -->"
    block: |
      <application type="normal">
        <maximized>yes</maximized>
      </application>
      <application class="Onboard">
        <maximized>no</maximized>
      </application>
  notify: Reconfigure Openbox

- name: Create the on-screen keyboard's settings directory
  ansible.builtin.file:
    path: /etc/onboard
    state: directory
    mode: "0755"

- name: On-screen keyboard defaults (docked at the bottom, above the launcher)
  ansible.builtin.copy:
    src: onboard-defaults.conf
    dest: /etc/onboard/onboard-defaults.conf
    mode: "0644"

- name: Openbox autostart (screen settings, screen always on, launcher)
  ansible.builtin.copy:
    src: autostart
    dest: "/home/{{ station_user }}/.config/openbox/autostart"
    owner: "{{ station_user }}"
    group: "{{ station_user }}"
    mode: "0755"

# ---- quiet boot: a start-up screen instead of scrolling text, then the launcher ----
# Settings > Display picks the screen (emcomm-splash): the Emcomm-CNC logo and
# callsign (the default), a picture of your own, Debian's spinner, or the
# start-up messages as text.

- name: Install the boot splash
  ansible.builtin.apt:
    name: [plymouth, plymouth-themes]
    install_recommends: false

- name: Create the start-up screen theme folder
  ansible.builtin.file:
    path: /usr/share/plymouth/themes/emcomm
    state: directory
    mode: "0755"

- name: Install the start-up screen theme
  ansible.builtin.copy:
    src: "splash/{{ item }}"
    dest: "/usr/share/plymouth/themes/emcomm/{{ item }}"
    mode: "0644"
  loop: [emcomm.plymouth, logo.png]

- name: Install the start-up screen helper
  ansible.builtin.copy:
    src: emcomm-splash
    dest: /usr/local/sbin/emcomm-splash
    mode: "0755"

- name: Let the station user pick the start-up screen in Settings
  ansible.builtin.copy:
    content: "{{ station_user }} ALL=(root) NOPASSWD: /usr/local/sbin/emcomm-splash\n"
    dest: /etc/sudoers.d/emcomm-splash
    mode: "0440"
    validate: visudo -cf %s

- name: Check for GRUB
  ansible.builtin.stat:
    path: /etc/default/grub
  register: kiosk_grub

- name: Create the GRUB settings directory
  ansible.builtin.file:
    path: /etc/default/grub.d
    state: directory
    mode: "0755"
  when: kiosk_grub.stat.exists

# Sets the Plymouth theme and the kernel options (quiet splash, added to those
# already there) for the choice saved in /etc/emcomm/splash.json, rebuilding the
# initramfs and GRUB's menu only when something changed. The GRUB menu still
# shows, so "Advanced options" > recovery mode stays reachable.
- name: Apply the start-up screen
  ansible.builtin.command: /usr/local/sbin/emcomm-splash apply
  register: kiosk_splash
  changed_when: kiosk_splash.stdout == "changed"

- name: No "Last login" or message of the day on the station's screen
  ansible.builtin.copy:
    content: ""
    dest: "/home/{{ station_user }}/.hushlogin"
    owner: "{{ station_user }}"
    group: "{{ station_user }}"
    mode: "0644"
