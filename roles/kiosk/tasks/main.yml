---
- name: Install X, Openbox and the on-screen keyboard (no desktop environment needed)
  ansible.builtin.apt:
    name:
      - xserver-xorg-core
      - xserver-xorg-input-libinput
      - xserver-xorg-video-all
      - xinit
      - x11-xserver-utils
      - x11-utils  # xprop: keeps apps below the launcher's Home bar
      - wmctrl  # the Home bar's open apps: bring to front, close
      - xinput  # turns a touchscreen with the screen
      - openbox
      - unclutter
      - xterm
      - pavucontrol
      - fonts-dejavu-core
      - dbus-user-session
      - onboard  # on-screen keyboard
      - gsettings-desktop-schemas  # Onboard won't start without them
    install_recommends: false

# IBM Plex is the launcher's preferred font, but not every Debian release ships
# it. Without it the launcher falls back to DejaVu.
- name: Install the launcher font if this release has it
  ansible.builtin.apt:
    name: fonts-ibm-plex
    install_recommends: false
  failed_when: false

- name: Install the display helper (resolution, rotation, text size)
  ansible.builtin.copy:
    src: emcomm-display
    dest: /usr/local/bin/emcomm-display
    mode: "0755"

# A dedicated station: boots straight into the launcher.
- name: Set up the kiosk
  ansible.builtin.import_tasks: kiosk.yml
  when: station_mode == 'kiosk'

# A computer already in use: an Emcomm-CNC app and login session, nothing else changed.
- name: Set up the desktop app and session
  ansible.builtin.import_tasks: desktop.yml
  when: station_mode == 'desktop'
