---
# Each app is tagged with its name so the launcher's Install button can install
# just that one: emcomm-update --app NAME runs this role with --tags NAME.

- name: Install app launch and setup scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: "0755"
  loop:
    - emcomm-start
    - emcomm-app-setup
    - emcomm-webview
    - emcomm-install-vara
  tags: [always]

- name: Install JS8Call
  ansible.builtin.apt:
    name: js8call
    install_recommends: false
  tags: [js8call]
  when: apps_install | bool

- name: Install WSJT-X
  ansible.builtin.apt:
    name: wsjtx
    install_recommends: false
  tags: [wsjtx]
  when: apps_install | bool

- name: Install fldigi and flamp
  ansible.builtin.apt:
    name: [fldigi, flamp]
    install_recommends: false
  tags: [fldigi]
  when: apps_install | bool

- name: Install flmsg
  ansible.builtin.apt:
    name: flmsg
    install_recommends: false
  tags: [flmsg]
  when: apps_install | bool

- name: Install Direwolf
  ansible.builtin.apt:
    name: direwolf
    install_recommends: false
  tags: [packet]
  when: apps_install | bool

- name: Install QSSTV for pictures over the air (SSTV)
  ansible.builtin.apt:
    name: qsstv
    install_recommends: false
  tags: [qsstv]
  when: apps_install | bool

# LibreOffice shows Word, Excel and PowerPoint attachments on the Files page (as a
# PDF) and edits them. Installed when the Files page first needs it.
- name: Install LibreOffice for attachments
  ansible.builtin.apt:
    name: [libreoffice-writer, libreoffice-calc, libreoffice-impress, libreoffice-gtk3]
    install_recommends: false
  tags: [libreoffice]
  when: apps_install | bool

- name: Install Xastir and Direwolf for APRS
  ansible.builtin.apt:
    name: [xastir, direwolf]
    install_recommends: false
  tags: [aprs]
  when: apps_install | bool

# Both clients are small, so installing either tile installs both.
- name: Install Meshtastic and MeshCore clients
  tags: [meshtastic, meshcore]
  when: apps_install | bool
  vars:
    apps_mesh_clients:
      meshtastic: { package: "contact=={{ apps_contact_version }}", command: contact }
      meshcore: { package: "meshcore-cli=={{ apps_meshcore_cli_version }}", command: meshcore-cli }
  block:
    # Meshtastic's own command line (it comes with the Mesh text client), for the
    # terminal. emcomm-mesh-check stands in front of it so it opens the mesh radio's
    # port, never the radio's CAT or PTT port. A meshtastic already there is left alone.
    - name: Check for a meshtastic command already on the PATH
      ansible.builtin.stat:
        path: /usr/local/bin/meshtastic
        follow: false
      register: apps_meshtastic_cli

    - name: Put Meshtastic's command line on the PATH
      ansible.builtin.file:
        src: /usr/local/bin/emcomm-mesh-check
        dest: /usr/local/bin/meshtastic
        state: link
        force: true  # emcomm-mesh-check may not be there yet when only a mesh tile is being installed
      when: not apps_meshtastic_cli.stat.exists or
        (apps_meshtastic_cli.stat.islnk and apps_meshtastic_cli.stat.lnk_source == '/usr/local/bin/emcomm-mesh-check')

    - name: Install Python's venv support
      ansible.builtin.apt:
        name: python3-venv
        install_recommends: false

    # Each client gets its own Python environment under /opt/emcomm, so pip
    # never touches Debian's own Python packages.
    - name: Install the client
      ansible.builtin.pip:
        name: "{{ item.value.package }}"
        virtualenv: "/opt/emcomm/{{ item.key }}"
        virtualenv_command: python3 -m venv
      loop: "{{ apps_mesh_clients | dict2items }}"

    - name: Put the client on the PATH
      ansible.builtin.file:
        src: "/opt/emcomm/{{ item.key }}/bin/{{ item.value.command }}"
        dest: "/usr/local/bin/{{ item.value.command }}"
        state: link
      loop: "{{ apps_mesh_clients | dict2items }}"

# The full mesh apps, from Flathub (see flatpak.yml). Meshtastic Desktop is
# Meshtastic's own app (the desktop build of its Android app); Meshy is a MeshCore
# app made for small touch screens (GTK4, also packaged by Debian from forky on).
- name: Install Meshtastic Desktop
  ansible.builtin.include_tasks:
    file: flatpak.yml
    apply:
      tags: [meshtastic-desktop]
  vars:
    apps_flatpak:
      name: Meshtastic Desktop
      id: "{{ apps_meshtastic_desktop_id }}"
      command: meshtastic-desktop
      tag: meshtastic-desktop
      fallback: The Mesh text tile still works.
  tags: [meshtastic-desktop]

- name: Install Meshy (MeshCore)
  ansible.builtin.include_tasks:
    file: flatpak.yml
    apply:
      tags: [meshy]
  vars:
    apps_flatpak:
      name: Meshy
      id: "{{ apps_meshy_id }}"
      command: meshy
      tag: meshy
      fallback: The MC text tile still works.
  tags: [meshy]

# CHIRP isn't packaged by Debian. Its download site (archive.chirpmyradio.com)
# sits behind a Cloudflare check that refuses scripts, so CHIRP is installed
# from its source on GitHub instead: pure Python, with its libraries from Debian.
# A failure here is reported, but doesn't stop the rest of the station updating.
- name: Install CHIRP
  tags: [chirp]
  when: apps_install | bool
  vars:
    apps_chirp_repo: https://github.com/kk7ds/chirp
  block:
    - name: Install CHIRP's GUI toolkit and libraries
      ansible.builtin.apt:
        name: [git, python3-venv, python3-wxgtk4.0, python3-yattag, python3-serial, python3-requests,
               python3-suds, python3-lark]
        install_recommends: false

    - name: Find the CHIRP commit to install
      ansible.builtin.command: git ls-remote {{ apps_chirp_repo }} {{ apps_chirp_version }}  # noqa: command-instead-of-module (only reads the remote)
      register: apps_chirp_remote
      changed_when: false
      when: apps_chirp_version is not regex('^[0-9a-f]{40}$')

    - name: Pick the commit
      ansible.builtin.set_fact:
        apps_chirp_commit: >-
          {{ apps_chirp_version if apps_chirp_remote is skipped
             else (apps_chirp_remote.stdout_lines | first | default('')).split() | first | default('') }}

    - name: Check the CHIRP version was found
      ansible.builtin.assert:
        that: apps_chirp_commit | length == 40
        fail_msg: "No CHIRP branch, tag or commit named {{ apps_chirp_version }} at {{ apps_chirp_repo }}."
        quiet: true

    - name: Read the installed CHIRP commit
      ansible.builtin.slurp:
        src: /opt/emcomm/chirp/emcomm-commit
      register: apps_chirp_installed
      failed_when: false

    # Its own Python environment, like the mesh clients, but able to see
    # Debian's wxPython and the libraries above. CHIRP's source always says
    # version 0, so reinstall whenever the commit changes.
    - name: Install CHIRP
      ansible.builtin.pip:
        name: "git+{{ apps_chirp_repo }}@{{ apps_chirp_commit }}"
        virtualenv: /opt/emcomm/chirp
        virtualenv_command: python3 -m venv
        virtualenv_site_packages: true
        extra_args: --force-reinstall --no-deps
      when: (apps_chirp_installed.content | default('') | b64decode | trim) != apps_chirp_commit

    - name: Check CHIRP starts
      ansible.builtin.command: /opt/emcomm/chirp/bin/python -c "import chirp.wxui"
      changed_when: false

    - name: Remember the installed CHIRP commit
      ansible.builtin.copy:
        content: "{{ apps_chirp_commit }}\n"
        dest: /opt/emcomm/chirp/emcomm-commit
        mode: "0644"

    - name: Put CHIRP on the PATH
      ansible.builtin.file:
        src: /opt/emcomm/chirp/bin/chirp
        dest: /usr/local/bin/chirp
        state: link
  rescue:
    - name: Report that CHIRP didn't install
      ansible.builtin.debug:
        msg: >-
          EMCOMM WARNING: CHIRP didn't install or update ({{ ansible_failed_task.name }}:
          {{ (ansible_failed_result.msg | default('') ~ ' ' ~ ansible_failed_result.stderr | default(''))
             | trim | truncate(400) }}). Everything else carried on.

- name: Install the station map
  tags: [map]
  when: apps_install | bool
  block:
    - name: Install the map window's web view
      ansible.builtin.apt:
        name: [python3-gi, gir1.2-webkit2-4.1]
        install_recommends: false

    - name: Create the map folders
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop: [/usr/share/emcomm/map, /var/cache/emcomm/natural-earth]

    - name: Install the map page and Leaflet
      ansible.builtin.copy:
        src: map/
        dest: /usr/share/emcomm/map/
        mode: "0644"
        directory_mode: "0755"

    - name: Download the Natural Earth map data
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/{{ apps_natural_earth_version }}/geojson/{{ item.key }}.geojson"
        dest: "/var/cache/emcomm/natural-earth/{{ item.key }}.geojson"
        checksum: "sha256:{{ item.value }}"
        mode: "0644"
      loop: "{{ apps_natural_earth_files | dict2items }}"
      register: apps_natural_earth

    # census.gov publishes no checksums; a year's files don't change once out.
    - name: Download the Census town lists
      ansible.builtin.get_url:
        url: "{{ apps_census_gazetteer_url }}/{{ apps_census_gazetteer_year }}_Gaz_{{ item }}_national.zip"
        dest: "/var/cache/emcomm/natural-earth/{{ apps_census_gazetteer_year }}_Gaz_{{ item }}_national.zip"
        mode: "0644"
      loop: "{{ apps_census_gazetteer_files }}"
      register: apps_census_towns

    - name: Install the map scripts
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        mode: "0755"
      loop: [emcomm-map, emcomm-map-prepare, emcomm-mesh-nodes]

    # Two files: basemap.js and basemap-detail.js (counties and roads, loaded when
    # zoomed in). Older builds made one; the second being missing rebuilds both.
    - name: Check for the base map
      ansible.builtin.stat:
        path: /usr/share/emcomm/map/basemap-detail.js
      register: apps_basemap

    - name: Build the offline base map
      ansible.builtin.command: emcomm-map-prepare /var/cache/emcomm/natural-earth /usr/share/emcomm/map/basemap.js
      when: apps_natural_earth is changed or apps_census_towns is changed or not apps_basemap.stat.exists
      changed_when: true

# SDR receivers. The Scanner is the station's own (numpy narrow-FM demod, audio
# through PipeWire); Gqrx is for tuning anywhere, HF included. Both use any
# receiver SoapySDR knows (RTL-SDR, Airspy, HackRF, LimeSDR, bladeRF...), install
# together and share ~/Scanner channels.csv (Gqrx gets it as bookmarks).
- name: Install the SDR scanner and Gqrx
  tags: [scanner, sdr]
  when: apps_install | bool
  block:
    - name: Install the SDR libraries, numpy, the audio player and Gqrx
      ansible.builtin.apt:
        name: [rtl-sdr, python3-numpy, python3-gi, pulseaudio-utils, gqrx-sdr, python3-soapysdr, soapysdr-tools,
               soapysdr-module-rtlsdr, soapysdr-module-airspy, soapysdr-module-hackrf, soapysdr-module-lms7,
               soapysdr-module-bladerf]
        install_recommends: false

    # Not every Debian release packages these; the station works without them.
    - name: Install SoapySDR drivers for the Airspy HF+ and ADALM-Pluto, where Debian has them
      ansible.builtin.apt:
        name: "{{ item }}"
        install_recommends: false
      loop: [soapysdr-module-airspyhf, soapysdr-module-plutosdr]
      register: apps_sdr_optional
      failed_when: false

    - name: Create the scanner's list folder
      ansible.builtin.file:
        path: /usr/share/emcomm/scanner
        state: directory
        mode: "0755"

    - name: Install the starting channel list (Vermont emergency channels)
      ansible.builtin.copy:
        src: scanner/
        dest: /usr/share/emcomm/scanner/
        mode: "0644"
        directory_mode: "0755"

    - name: Install the scanner
      ansible.builtin.copy:
        src: emcomm-scanner
        dest: /usr/local/bin/emcomm-scanner
        mode: "0755"

# A desktop keeps its own browser: the tile opens a page of the same bookmarks in it.
- name: Write the bookmarks page for the person's own browser
  ansible.builtin.template:
    src: bookmarks.html.j2
    dest: /usr/share/emcomm/bookmarks.html
    mode: "0644"
  when: station_mode == 'desktop'
  tags: [always]

- name: Install the web browser
  tags: [browser]
  when: apps_install | bool and station_mode == 'kiosk'
  block:
    - name: Install Chromium
      ansible.builtin.apt:
        name: chromium
        install_recommends: false

    - name: Create Chromium's policy folder
      ansible.builtin.file:
        path: /etc/chromium/policies/managed
        state: directory
        mode: "0755"

    - name: Add the ham radio bookmarks and turn off first-run prompts
      ansible.builtin.copy:
        content: "{{ apps_browser_policy | to_nice_json }}\n"
        dest: /etc/chromium/policies/managed/emcomm.json
        mode: "0644"
      vars:
        apps_browser_policy:
          BookmarkBarEnabled: true
          ManagedBookmarks: "{{ [{'toplevel_name': 'Ham radio'}] + apps_browser_bookmarks }}"
          DefaultBrowserSettingEnabled: false
          MetricsReportingEnabled: false
          PromotionsEnabled: false

- name: Install the offline library
  tags: [library]
  when: apps_install | bool
  block:
    - name: Install Kiwix's book server and the web view
      ansible.builtin.apt:
        name: [kiwix-tools, gir1.2-webkit2-4.1, udisks2]
        install_recommends: false

    - name: Install the Library window
      ansible.builtin.copy:
        src: emcomm-library
        dest: /usr/local/bin/emcomm-library
        mode: "0755"

- name: Install Pat
  tags: [pat]
  when: apps_install | bool
  block:
    - name: Install the mailbox window's web view
      ansible.builtin.apt:
        name: gir1.2-webkit2-4.1
        install_recommends: false

    - name: Create the download cache
      ansible.builtin.file:
        path: /var/cache/emcomm
        state: directory
        mode: "0755"

    - name: Download Pat
      ansible.builtin.get_url:
        url: "https://github.com/la5nta/pat/releases/download/v{{ apps_pat_version }}/pat_{{ apps_pat_version }}_linux_amd64.deb"
        dest: "/var/cache/emcomm/pat_{{ apps_pat_version }}_linux_amd64.deb"
        checksum: "sha256:{{ apps_pat_sha256 }}"
        mode: "0644"

    - name: Install Pat
      ansible.builtin.apt:
        deb: "/var/cache/emcomm/pat_{{ apps_pat_version }}_linux_amd64.deb"

- name: Install ardopcf
  ansible.builtin.get_url:
    url: "https://github.com/pflarue/ardop/releases/download/{{ apps_ardopcf_version }}/ardopcf_amd64_Linux_64"
    dest: /usr/local/bin/ardopcf
    mode: "0755"
  tags: [ardop]
  when: apps_install | bool

- name: Set up Wine for VARA
  when: apps_vara | bool and apps_install | bool
  tags: [vara]
  block:
    - name: Check for 32-bit package support
      ansible.builtin.command: dpkg --print-foreign-architectures
      register: apps_foreign_arch
      changed_when: false

    - name: Enable 32-bit packages (VARA is a 32-bit Windows program)
      ansible.builtin.command: dpkg --add-architecture i386
      when: "'i386' not in apps_foreign_arch.stdout_lines"
      changed_when: true

    - name: Install Wine
      ansible.builtin.apt:
        name: [wine, "wine32:i386", cabextract, unzip, udisks2, gir1.2-webkit2-4.1]
        update_cache: true
        install_recommends: false

    - name: Install winetricks
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/Winetricks/winetricks/{{ apps_winetricks_version }}/src/winetricks"
        dest: /usr/local/bin/winetricks
        mode: "0755"
