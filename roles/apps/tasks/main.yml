---
# Each app is tagged with its name so the launcher's Install button can install
# just that one: emcomm-update --app NAME runs this role with --tags NAME.

- name: Install app launch and setup scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: "0755"
  loop:
    - emcomm-start
    - emcomm-app-setup
    - emcomm-webview
    - emcomm-install-vara
  tags: [always]

- name: Install JS8Call
  ansible.builtin.apt:
    name: js8call
    install_recommends: false
  tags: [js8call]

- name: Install WSJT-X
  ansible.builtin.apt:
    name: wsjtx
    install_recommends: false
  tags: [wsjtx]

- name: Install fldigi and flamp
  ansible.builtin.apt:
    name: [fldigi, flamp]
    install_recommends: false
  tags: [fldigi]

- name: Install flmsg
  ansible.builtin.apt:
    name: flmsg
    install_recommends: false
  tags: [flmsg]

- name: Install Direwolf
  ansible.builtin.apt:
    name: direwolf
    install_recommends: false
  tags: [packet]

- name: Install Xastir and Direwolf for APRS
  ansible.builtin.apt:
    name: [xastir, direwolf]
    install_recommends: false
  tags: [aprs]

# Both clients are small, so installing either tile installs both.
- name: Install Meshtastic and MeshCore clients
  tags: [meshtastic, meshcore]
  vars:
    apps_mesh_clients:
      meshtastic: { package: "contact=={{ apps_contact_version }}", command: contact }
      meshcore: { package: "meshcore-cli=={{ apps_meshcore_cli_version }}", command: meshcore-cli }
  block:
    - name: Install Python's venv support
      ansible.builtin.apt:
        name: python3-venv
        install_recommends: false

    # Each client gets its own Python environment under /opt/emcomm, so pip
    # never touches Debian's own Python packages.
    - name: Install the client
      ansible.builtin.pip:
        name: "{{ item.value.package }}"
        virtualenv: "/opt/emcomm/{{ item.key }}"
        virtualenv_command: python3 -m venv
      loop: "{{ apps_mesh_clients | dict2items }}"

    - name: Put the client on the PATH
      ansible.builtin.file:
        src: "/opt/emcomm/{{ item.key }}/bin/{{ item.value.command }}"
        dest: "/usr/local/bin/{{ item.value.command }}"
        state: link
      loop: "{{ apps_mesh_clients | dict2items }}"

# CHIRP isn't packaged by Debian; the project publishes a Python wheel per build.
# A failure here is reported, but doesn't stop the rest of the station updating.
- name: Install CHIRP
  tags: [chirp]
  vars:
    apps_chirp_index: https://archive.chirpmyradio.com/chirp_next/
  block:
    - name: Install CHIRP's GUI toolkit
      ansible.builtin.apt:
        name: [python3-venv, python3-wxgtk4.0, python3-yattag]
        install_recommends: false

    - name: List CHIRP builds
      ansible.builtin.uri:
        url: "{{ apps_chirp_index }}"
        return_content: true
      register: apps_chirp_builds

    # The newest builds first. A build folder can be listed before its files
    # are all uploaded, so look a few back for one with a wheel.
    - name: Pick the newest CHIRP builds
      ansible.builtin.set_fact:
        apps_chirp_folders: >-
          {{ (apps_chirp_builds.content | regex_findall('href="((?:next-)?\d{8})/"')
              | select('search', apps_chirp_build) | sort | reverse | list)[:3] }}

    - name: Check a CHIRP build was found
      ansible.builtin.assert:
        that: apps_chirp_folders | length > 0
        fail_msg: "No CHIRP build listed at {{ apps_chirp_index }} (the page may have changed)."
        quiet: true

    - name: List the builds' files
      ansible.builtin.uri:
        url: "{{ apps_chirp_index }}{{ item }}/"
        return_content: true
      loop: "{{ apps_chirp_folders }}"
      register: apps_chirp_files
      failed_when: false

    - name: Pick the newest wheel
      ansible.builtin.set_fact:
        apps_chirp_wheel_url: >-
          {%- set ns = namespace(url='') -%}
          {%- for listing in apps_chirp_files.results -%}
            {%- set wheel = listing.content | default('') | regex_search('chirp-\d{8}-py3-none-any\.whl') -%}
            {%- if wheel and not ns.url -%}{%- set ns.url = apps_chirp_index ~ listing.item ~ '/' ~ wheel -%}{%- endif -%}
          {%- endfor -%}
          {{ ns.url }}

    - name: Check a build has a wheel
      ansible.builtin.assert:
        that: apps_chirp_wheel_url | length > 0
        fail_msg: "None of the newest CHIRP builds ({{ apps_chirp_folders | join(', ') }}) has a Python wheel."
        quiet: true

    # Its own Python environment, like the mesh clients, but able to see
    # Debian's wxPython and yattag.
    - name: Install CHIRP
      ansible.builtin.pip:
        name: "{{ apps_chirp_wheel_url }}"
        virtualenv: /opt/emcomm/chirp
        virtualenv_command: python3 -m venv
        virtualenv_site_packages: true

    - name: Put CHIRP on the PATH
      ansible.builtin.file:
        src: /opt/emcomm/chirp/bin/chirp
        dest: /usr/local/bin/chirp
        state: link
  rescue:
    - name: Report that CHIRP didn't install
      ansible.builtin.debug:
        msg: >-
          EMCOMM WARNING: CHIRP didn't install or update ({{ ansible_failed_task.name }}:
          {{ (ansible_failed_result.msg | default('') ~ ' ' ~ ansible_failed_result.stderr | default(''))
             | trim | truncate(400) }}). Everything else carried on.

- name: Install the station map
  tags: [map]
  block:
    - name: Install the map window's web view
      ansible.builtin.apt:
        name: [python3-gi, gir1.2-webkit2-4.1]
        install_recommends: false

    - name: Create the map folders
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop: [/usr/share/emcomm/map, /var/cache/emcomm/natural-earth]

    - name: Install the map page and Leaflet
      ansible.builtin.copy:
        src: map/
        dest: /usr/share/emcomm/map/
        mode: "0644"
        directory_mode: "0755"

    - name: Download the Natural Earth map data
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/{{ apps_natural_earth_version }}/geojson/{{ item.key }}.geojson"
        dest: "/var/cache/emcomm/natural-earth/{{ item.key }}.geojson"
        checksum: "sha256:{{ item.value }}"
        mode: "0644"
      loop: "{{ apps_natural_earth_files | dict2items }}"
      register: apps_natural_earth

    - name: Install the map scripts
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        mode: "0755"
      loop: [emcomm-map, emcomm-map-prepare]

    - name: Check for the base map
      ansible.builtin.stat:
        path: /usr/share/emcomm/map/basemap.js
      register: apps_basemap

    - name: Build the offline base map
      ansible.builtin.command: emcomm-map-prepare /var/cache/emcomm/natural-earth /usr/share/emcomm/map/basemap.js
      when: apps_natural_earth is changed or not apps_basemap.stat.exists
      changed_when: true

- name: Install the web browser
  tags: [browser]
  block:
    - name: Install Chromium
      ansible.builtin.apt:
        name: chromium
        install_recommends: false

    - name: Create Chromium's policy folder
      ansible.builtin.file:
        path: /etc/chromium/policies/managed
        state: directory
        mode: "0755"

    - name: Add the ham radio bookmarks and turn off first-run prompts
      ansible.builtin.copy:
        content: "{{ apps_browser_policy | to_nice_json }}\n"
        dest: /etc/chromium/policies/managed/emcomm.json
        mode: "0644"
      vars:
        apps_browser_policy:
          BookmarkBarEnabled: true
          ManagedBookmarks: "{{ [{'toplevel_name': 'Ham radio'}] + apps_browser_bookmarks }}"
          DefaultBrowserSettingEnabled: false
          MetricsReportingEnabled: false
          PromotionsEnabled: false

- name: Install the offline library
  tags: [library]
  block:
    - name: Install Kiwix's book server and the web view
      ansible.builtin.apt:
        name: [kiwix-tools, gir1.2-webkit2-4.1, udisks2]
        install_recommends: false

    - name: Install the Library window
      ansible.builtin.copy:
        src: emcomm-library
        dest: /usr/local/bin/emcomm-library
        mode: "0755"

- name: Install Pat
  tags: [pat]
  block:
    - name: Install the mailbox window's web view
      ansible.builtin.apt:
        name: gir1.2-webkit2-4.1
        install_recommends: false

    - name: Create the download cache
      ansible.builtin.file:
        path: /var/cache/emcomm
        state: directory
        mode: "0755"

    - name: Download Pat
      ansible.builtin.get_url:
        url: "https://github.com/la5nta/pat/releases/download/v{{ apps_pat_version }}/pat_{{ apps_pat_version }}_linux_amd64.deb"
        dest: "/var/cache/emcomm/pat_{{ apps_pat_version }}_linux_amd64.deb"
        checksum: "sha256:{{ apps_pat_sha256 }}"
        mode: "0644"

    - name: Install Pat
      ansible.builtin.apt:
        deb: "/var/cache/emcomm/pat_{{ apps_pat_version }}_linux_amd64.deb"

- name: Install ardopcf
  ansible.builtin.get_url:
    url: "https://github.com/pflarue/ardop/releases/download/{{ apps_ardopcf_version }}/ardopcf_amd64_Linux_64"
    dest: /usr/local/bin/ardopcf
    mode: "0755"
  tags: [ardop]

- name: Set up Wine for VARA
  when: apps_vara | bool
  tags: [vara]
  block:
    - name: Check for 32-bit package support
      ansible.builtin.command: dpkg --print-foreign-architectures
      register: apps_foreign_arch
      changed_when: false

    - name: Enable 32-bit packages (VARA is a 32-bit Windows program)
      ansible.builtin.command: dpkg --add-architecture i386
      when: "'i386' not in apps_foreign_arch.stdout_lines"
      changed_when: true

    - name: Install Wine
      ansible.builtin.apt:
        name: [wine, "wine32:i386", cabextract, unzip, udisks2, gir1.2-webkit2-4.1]
        update_cache: true
        install_recommends: false

    - name: Install winetricks
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/Winetricks/winetricks/{{ apps_winetricks_version }}/src/winetricks"
        dest: /usr/local/bin/winetricks
        mode: "0755"
