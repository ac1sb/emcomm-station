---
# Upstream releases installed outside Debian's archive. Bump the version and
# checksum together.

# Pat 1.0 (Debian 13 ships 0.15, which has no web configuration page).
apps_pat_version: 1.0.0
apps_pat_sha256: 3dec3c2f0802707e7789c6752e955f141365e14923cc5c6331ddb8af48663d32

# ardopcf, the maintained ARDOP modem. Upstream publishes no checksums.
apps_ardopcf_version: 1.0.4.1.3

# Meshtastic's terminal client (contact) and the MeshCore client, from PyPI.
apps_contact_version: 1.7.1
apps_meshcore_cli_version: 1.6.6

# Natural Earth (public domain) for the offline station map: countries, lakes,
# state lines, US counties, North American highways and towns.
apps_natural_earth_version: v5.1.2
apps_natural_earth_files:
  ne_50m_admin_0_countries: 3e458fc036ad0a66411f2c1e6cac49c5d7bfb81cb1123bc513b22511a2b7fdeb
  ne_50m_lakes: d350b75978b26fe839b797c2c529b2fb8f47fb3983c03f4964e36d5df9378a52
  ne_50m_admin_1_states_provinces_lines: 72cca93c850d412628a5da4bc5ebfe21ba4d376eb34611bde6b623ee73f0fdcf
  ne_10m_admin_2_counties: 9a80308d80eef51a0c1ade49aeb9ca877957a346f880e177a85527ef6cfdd1bb
  ne_10m_roads: 66a0c7b438e92fd124822cc5921cfa11042f48c294ade5e0f03f2c6640fd0248
  ne_10m_populated_places_simple: fd3fa867a320cbd5c5b6bb5bc550afeec2939fb2cef688e508007282a55ac42f

# winetricks lives in Debian's contrib section, which a default install doesn't
# enable, so the script comes straight from the upstream release tag.
apps_winetricks_version: "20260125"

# Wine and the VARA installer helper. VARA itself is downloaded on the station
# the first time its tile is tapped.
apps_vara: true

# Bookmarks bar in Chromium (the Browser tile). Edit and run Update station
# to change them.
apps_browser_bookmarks:
  - { name: World Radio League, url: "https://worldradioleague.com" }
  - { name: QRZ, url: "https://www.qrz.com" }
  - { name: PSKReporter, url: "https://pskreporter.info/pskmap.html" }
  - { name: aprs.fi, url: "https://aprs.fi" }
  - { name: RepeaterBook, url: "https://www.repeaterbook.com" }
  - { name: NWS weather, url: "https://www.weather.gov" }
  - { name: Space weather, url: "https://www.swpc.noaa.gov" }
  - { name: Winlink, url: "https://winlink.org" }
  - { name: WebSDR, url: "http://websdr.org" }
  - { name: LoTW, url: "https://lotw.arrl.org" }

# CHIRP version to install from its source on GitHub (github.com/kk7ds/chirp):
# a branch, a tag or a commit. "master" is what CHIRP's daily "next" builds are
# made from, and is fetched again each time the station is updated.
apps_chirp_version: master
