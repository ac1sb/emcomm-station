---
- name: Install launcher dependencies
  ansible.builtin.apt:
    name:
      - python3-gi
      - gir1.2-gtk-3.0
      - librsvg2-common  # draws the .svg tile icons
      - udisks2  # lets the kiosk user open USB sticks, e.g. to pick a tile icon
    install_recommends: false

- name: Install the tile icons
  ansible.builtin.copy:
    src: icons/
    dest: /usr/share/emcomm/icons/
    mode: "0644"
    directory_mode: "0755"

- name: Install the Reference page's frequency lists and band plan
  ansible.builtin.copy:
    src: reference/
    dest: /usr/share/emcomm/reference/
    mode: "0644"
    directory_mode: "0755"

- name: Install the launcher
  ansible.builtin.copy:
    src: emcomm-launcher
    dest: /usr/local/bin/emcomm-launcher
    mode: "0755"

- name: Write launcher settings
  ansible.builtin.copy:
    content: "{{ launcher_config | to_nice_json }}\n"
    dest: /etc/emcomm/launcher.json
    mode: "0644"
  vars:
    launcher_config:
      apps: "{{ launcher_apps }}"
