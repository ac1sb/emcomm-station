---
- name: Install launcher dependencies
  ansible.builtin.apt:
    name:
      - python3-gi
      - python3-gi-cairo  # draws the ICS-213 form on screen (the draw signal's cairo context)
      - gir1.2-gtk-3.0
      - librsvg2-common  # draws the .svg tile icons
      - udisks2  # lets the kiosk user open USB sticks, e.g. to pick a tile icon
      - gir1.2-poppler-0.18  # draws the ICS-213 form on screen and for printing
      - python3-pypdf  # fills in the ICS-213 form
      - python3-markdown  # turns the operations guide into a page
      - gir1.2-webkit2-4.1  # shows the operations guide
      - gir1.2-vte-2.91  # the terminal (Diagnostics > Terminal)
    install_recommends: false

- name: Install the tile icons
  ansible.builtin.copy:
    src: icons/
    dest: /usr/share/emcomm/icons/
    mode: "0644"
    directory_mode: "0755"

- name: Install the Reference page's frequency lists and band plan
  ansible.builtin.copy:
    src: reference/
    dest: /usr/share/emcomm/reference/
    mode: "0644"
    directory_mode: "0755"

- name: Install the county SAME code list for the weather radio setup
  ansible.builtin.copy:
    src: same-codes.csv
    dest: /usr/share/emcomm/same-codes.csv
    mode: "0644"

- name: Install the ICS forms (FEMA's fillable ICS 213)
  ansible.builtin.copy:
    src: forms/
    dest: /usr/share/emcomm/forms/
    mode: "0644"
    directory_mode: "0755"

- name: Install the operations guide and its pictures
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
    directory_mode: "0755"
  loop:
    - { src: "{{ playbook_dir }}/docs/operations-guide.md", dest: /usr/share/emcomm/guide/operations-guide.md }
    - { src: "{{ playbook_dir }}/docs/guide/", dest: /usr/share/emcomm/guide/guide/ }

- name: Install the launcher and its helpers (Online page, ICS forms, backup)
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: "0755"
  loop: [emcomm-launcher, emcomm-online, emcomm-ics, emcomm-backup, emcomm-callsign, emcomm-guide, emcomm-files, emcomm-voacap]

# The FCC licence list and RadioID.net's DMR ID list for offline lookup: each
# downloaded when it's over a week old and the station is online. Offline, the
# last lists are kept. The download (about 170 MB) and the rebuild run in the
# background at low priority, so Update station doesn't wait minutes for them;
# Logs > Callsign list downloads shows how it went, and a failed one is tried
# again at the next Update station.
- name: Update the offline callsign lists
  tags: [callsign]
  block:
    - name: Check whether the callsign or DMR ID list is over a week old
      ansible.builtin.command: emcomm-callsign due --max-age 7
      register: launcher_callsign_due
      changed_when: false
      failed_when: launcher_callsign_due.rc > 1

    - name: Download the callsign lists in the background
      ansible.builtin.command: >-
        systemd-run --unit=emcomm-callsign-update --collect --no-block
        --property=Nice=10 --property=IOSchedulingClass=idle
        /bin/sh -c 'exec /usr/local/bin/emcomm-callsign update --max-age 7 >/var/log/emcomm-callsign.log 2>&1'
      register: launcher_callsign
      changed_when: launcher_callsign.rc == 0
      # Already running from an update moments ago: that one carries on.
      failed_when: launcher_callsign.rc != 0 and 'already' not in launcher_callsign.stderr
      when: launcher_callsign_due.rc == 0

    - name: Say the callsign lists are downloading
      ansible.builtin.debug:
        msg: >-
          {{ launcher_callsign_due.stdout }} It's downloading in the background
          (about 170 MB, a few minutes); lookups use the old list until it's done.
          Logs > Callsign list downloads shows how it went.
      when: launcher_callsign_due.rc == 0
  rescue:
    - name: Report that the callsign list didn't update
      ansible.builtin.debug:
        msg: >-
          EMCOMM WARNING: The callsign or DMR ID list didn't download
          ({{ (ansible_failed_result.stderr | default('')) | trim | truncate(300) }}).
          Callsign lookup works after an Update station with internet. Everything else carried on.

- name: Write launcher settings
  ansible.builtin.copy:
    content: "{{ launcher_config | to_nice_json }}\n"
    dest: /etc/emcomm/launcher.json
    mode: "0644"
  vars:
    launcher_config:
      apps: "{{ launcher_apps }}"
      folders: "{{ launcher_folders }}"
