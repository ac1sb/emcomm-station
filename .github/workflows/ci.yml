name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install checkers
        run: pip install ansible-core ansible-lint shellcheck-py pyyaml pypdf numpy
      - name: Playbook syntax
        run: |
          ansible-playbook site.yml --syntax-check
          ansible-playbook site.yml --syntax-check -e station_mode=desktop
      - name: Ansible lint
        run: ansible-lint
      - name: Shell scripts
        run: >-
          shellcheck roles/diagnostics/files/emcomm-diag roles/diagnostics/files/emcomm-ptt-test
          roles/base/files/emcomm-update roles/apps/files/emcomm-start roles/apps/files/emcomm-install-vara
          roles/kiosk/files/emcomm-session install-desktop.sh uninstall-desktop.sh
          && shellcheck -s bash roles/kiosk/files/bash_profile roles/kiosk/files/autostart
      - name: Python compiles
        run: >-
          python -m py_compile roles/launcher/files/emcomm-launcher roles/radio/files/emcomm-apply-settings
          roles/apps/files/emcomm-app-setup roles/apps/files/emcomm-webview roles/radio/files/emcomm-audio-default
          roles/apps/files/emcomm-map roles/apps/files/emcomm-map-prepare roles/launcher/files/emcomm-online
          roles/launcher/files/emcomm-ics roles/radio/files/emcomm-nwr roles/radio/files/emcomm-adsb roles/apps/files/emcomm-library
          roles/launcher/files/emcomm-backup roles/radio/files/emcomm-recorder roles/radio/files/emcomm-stream roles/kiosk/files/emcomm-display
          roles/apps/files/emcomm-scanner roles/apps/files/emcomm-mesh-nodes roles/radio/files/emcomm-igate
          roles/kiosk/files/emcomm-splash
      - name: Helper tests
        run: |
          python tests/test_apply_settings.py
          python tests/test_app_setup.py
          python tests/test_online.py
          python tests/test_ics.py
          python tests/test_nwr.py
          python tests/test_adsb.py
          python tests/test_igate.py
          python tests/test_library.py
          python tests/test_backup.py
          python tests/test_recorder.py
          python tests/test_display.py
          python tests/test_stream.py
          python tests/test_scanner.py
          python tests/test_map_prepare.py
          python tests/test_mesh_nodes.py
          python tests/test_splash.py
          python tests/test_igate.py

  launcher:
    # The real launcher, headless: the Forms page, the ICS-213 editor, Send over the
    # radio against a fake fldigi, and Net control.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK, Poppler and a virtual display
        run: >-
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends
          python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-poppler-0.18 gir1.2-pango-1.0
          python3-yaml python3-pypdf xvfb fonts-dejavu-core
      - name: Launcher smoke test
        run: EMCOMM_SMOKE_REQUIRED=1 xvfb-run -a -s "-screen 0 1280x800x24" python3 tests/smoke_launcher.py
